<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Câmera pinhole projetando um objeto invertido sobre o plano de imagem">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1024"/><stop offset="1" stop-color="#1b2050"/></linearGradient>
<pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#fff" stroke-opacity=".055" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)"/>
<text x="80" y="112" font-family="Inter, Segoe UI, sans-serif" fill="#8f9ac4" font-size="19" letter-spacing=".08em">MODELO PINHOLE</text>
<polygon points="420,310 980,190 980,430" fill="#7c5cff" fill-opacity=".10"/>
<line x1="180" y1="310" x2="1120" y2="310" stroke="#39406e" stroke-width="1.6" stroke-dasharray="8 7"/>
<text x="1128" y="316" font-family="monospace" font-size="16" fill="#8f9ac4">Z</text>
<rect x="262" y="212" width="176" height="196" rx="10" fill="#141a38" stroke="#2a3160" stroke-width="2"/>
<line x1="280" y1="196" x2="280" y2="424" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
<text x="196" y="176" font-family="Inter, Segoe UI, sans-serif" font-size="17" fill="#22d3ee">plano de imagem</text>
<g stroke="#fbbf24" stroke-width="2.4" stroke-opacity=".85">
<line x1="980" y1="190" x2="280" y2="340"/><line x1="980" y1="430" x2="280" y2="280"/>
<line x1="980" y1="310" x2="280" y2="310"/>
</g>
<circle cx="420" cy="310" r="9" fill="#e9ecfb"/>
<circle cx="420" cy="310" r="20" fill="none" stroke="#e9ecfb" stroke-width="2" stroke-opacity=".5"/>
<text x="372" y="268" font-family="Inter, Segoe UI, sans-serif" font-size="17" fill="#e9ecfb">centro óptico</text>
<line x1="280" y1="280" x2="280" y2="340" stroke="#f472b6" stroke-width="8" stroke-linecap="round"/>
<text x="150" y="470" font-family="monospace" font-size="17" fill="#f472b6">imagem invertida</text>
<g stroke="#a78bfa" stroke-width="6" stroke-linecap="round"><line x1="980" y1="430" x2="980" y2="190"/></g>
<polygon points="980,178 968,206 992,206" fill="#a78bfa"/>
<text x="1000" y="200" font-family="monospace" font-size="19" fill="#a78bfa">X</text>
<text x="1000" y="428" font-family="Inter, Segoe UI, sans-serif" font-size="17" fill="#a78bfa">objeto real</text>
<g stroke="#8f9ac4" stroke-width="1.6">
<line x1="280" y1="470" x2="420" y2="470"/><line x1="280" y1="462" x2="280" y2="478"/><line x1="420" y1="462" x2="420" y2="478"/>
<line x1="420" y1="512" x2="980" y2="512"/><line x1="420" y1="504" x2="420" y2="520"/><line x1="980" y1="504" x2="980" y2="520"/>
</g>
<text x="330" y="494" font-family="monospace" font-size="19" fill="#8f9ac4">f</text>
<text x="690" y="504" font-family="monospace" font-size="19" fill="#8f9ac4">Z</text>
<text x="80" y="586" font-family="monospace" font-size="24" fill="#e9ecfb">x = f · X / Z          y = f · Y / Z</text>
<text x="620" y="586" font-family="Inter, Segoe UI, sans-serif" font-size="17" fill="#8f9ac4">toda a perspectiva mora nessa divisão por Z</text>
